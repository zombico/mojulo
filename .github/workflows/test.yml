name: Tests

on:
  pull_request:
  push:
    # main, and the release-candidate branches (`<MMDD>-consolidated`): the whole suite, the deep sweeps and the e2e
    # tier run here, not on a contributor's machine (CLAUDE.md "Test tiers": locally, `npm run test:changed`)
    branches: [main, '*-consolidated']
  workflow_dispatch:

# Cancel in-progress runs on the same branch / PR when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests / ${{ matrix.os_node.os }} / node ${{ matrix.os_node.node }} / shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      # The byte pins (*.char.test.js, *.trace.test.js) are held on the REFERENCE runtime, Node 22, on both CPUs
      # (and its engines floor): the same recipe on the same runtime is the same bytes. A newer Node major may round
      # the last digits of the engine's maths differently, so its leg runs everything but the byte pins (`pins: false`):
      # across runtimes a render is equal within tolerance, not byte for byte. Each leg's suite is split three ways
      # (vitest --shard): the whole suite is about three quarters of an hour on four cores, too long for one runner.
      matrix:
        os_node:
          - { os: ubuntu-latest, node: '22.14.0', pins: true }   # the engines floor (22.12 and 22.13 crash in better-sqlite3)
          - { os: ubuntu-latest, node: '22', pins: true }
          - { os: ubuntu-latest, node: '24', pins: false }
          - { os: macos-latest, node: '22', pins: true }
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os_node.os }}
    steps:
      - uses: actions/checkout@v4

      # Control requires Node >= 22.14: the mcp-stdio bin enforces that floor
      # (scripts/mcp-stdio.mjs), and node-web-audio-api@2 declares
      # engines >= 22 — as an optionalDependency, npm on Node 20 silently
      # skips it and the beats tests fail with ERR_MODULE_NOT_FOUND.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.os_node.node }}

      - name: Install control
        working-directory: control
        # (node-gyp builds better-sqlite3 against the runner's own Node headers, the ones setup-node installed: their
        # download from nodejs.org drops often enough to fail an install before any test runs)
        run: npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")" npm install

      - name: Test control (shard ${{ matrix.shard }} of 3)
        working-directory: control
        run: npx vitest run --shard=${{ matrix.shard }}/3 ${{ !matrix.os_node.pins && '--exclude "**/*.char.test.js" --exclude "**/*.trace.test.js"' || '' }}

      # the deep sweeps and the book once a leg, on its first shard
      - name: Deep sweeps (*.deep.test.js)
        if: matrix.shard == 1
        working-directory: control
        run: npm run test:deep

      - name: Test the bundled recipe book
        if: matrix.shard == 1
        working-directory: control
        run: npm run test:book

  # The e2e tier (vitest.e2e.config.js): whole worlds through the real handlers and games whose audit walks each
  # level in headless Chrome. A third of the suite's time, so `npm test` leaves it out and it runs here, once, on
  # one leg; the byte pins it rests on run on every reference leg of the matrix above.
  e2e:
    name: e2e / ubuntu-latest / node 22 / shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # two hours and more on one runner: split two ways
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install control
        working-directory: control
        # (node-gyp builds better-sqlite3 against the runner's own Node headers, the ones setup-node installed: their
        # download from nodejs.org drops often enough to fail an install before any test runs)
        run: npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")" npm install

      - name: Test the e2e tier (shard ${{ matrix.shard }} of 2)
        working-directory: control
        # design-game.quick holds about 2 GB of live heap by its last tests, at V8's default limit: the forks get
        # more (the runner has 16 GB). It was the worker that died on the macOS legs before it moved here.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npx vitest run --config vitest.e2e.config.js --shard=${{ matrix.shard }}/2

  # The Godot gate (the engine handoff's): a pinned Godot, its download checked against the release's own SHA512 sums
  # and cached, so MOJULO_GODOT names a real engine somewhere that runs. The suites it runs are the Godot legs the
  # handoff keeps (a figure's import, its engine skeleton and retarget, its clips); the handoff's own probes (materials,
  # environment, markers) join them as they are built. Unity and Unreal stay local gates (their editors need accounts).
  godot:
    name: godot gate / ubuntu-latest / node 22 / Godot ${{ vars.GODOT_VERSION || '4.7.2' }}
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: ${{ vars.GODOT_VERSION || '4.7.2' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Fetch Godot (pinned, checked against the release's SHA512 sums)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mkdir -p ~/godot && cd ~/godot
          curl -fsSL --retry 4 -o "$zip" "$base/$zip"
          curl -fsSL --retry 4 -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " ${zip}\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip" SHA512-SUMS.txt
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"

      - name: Name the engine
        run: |
          godot="$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          "$godot" --headless --version
          echo "MOJULO_GODOT=$godot" >> "$GITHUB_ENV"

      - name: Install control
        working-directory: control
        # (node-gyp builds better-sqlite3 against the runner's own Node headers, the ones setup-node installed)
        run: npm_config_nodedir="$(dirname "$(dirname "$(command -v node)")")" npm install

      - name: The Godot legs the handoff keeps
        working-directory: control
        run: npx vitest run lib/graph/scene/godot-humanoid-pack.test.js

  lint-hygiene:
    name: lint hygiene (node --check + locale validator + manifest pins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The plugin-version check below compares against the PR's base branch.
          fetch-depth: 0

      # Node 22: control's package.json declares "type": "module", so
      # node --check parses its .js files as ESM — keep the checker on the
      # same Node line the control plane actually requires (>= 22.14).
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Syntax floor — there is no typecheck script, so node --check is the
      # cheapest way to catch a syntax error sitting in main.
      - name: node --check (control)
        run: |
          find control -type f \( -name '*.js' -o -name '*.mjs' \) \
            -not -path '*/node_modules/*' \
            -not -path '*/.next/*' \
            -not -path '*/data/*' \
            -not -path '*/lib/embedder/models/*' \
            -print0 | xargs -0 -n1 node --check

      # The Claude plugin, glama.json and server.json name the npm version by hand; they must
      # all run control/package.json's version. On a PR, a change under plugins/mojulo/ must
      # also raise plugin.json's version (Claude Code caches an installed plugin by it).
      - name: Plugin and registry manifests pin the package version
        run: node control/scripts/check-plugin-version.mjs ${{ github.event_name == 'pull_request' && format('--since origin/{0}', github.base_ref) || '' }}

      # Locale catalog parity — runs the existing validator against every
      # non-en code so the EN-default coding standard from CLAUDE.md doesn't
      # silently desync the other 12 catalogs.
      - name: Validate locale catalogs
        working-directory: control
        run: |
          for f in messages/*.json; do
            code=$(basename "$f" .json)
            if [ "$code" != "en" ]; then
              echo "validating $code"
              node scripts/validate-locale.mjs en "$code"
            fi
          done

  smoke:
    name: README install-success smoke
    runs-on: ubuntu-latest
    # Slower than unit tests (a full Next build + control-plane boot; the
    # control plane fetches no model since 2.0.7). Allow up to 10 minutes.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node 22: the README install path requires it (mcp-stdio's Node floor),
      # and the control build needs node-web-audio-api present — an
      # optionalDependency npm skips on Node 20 (engines >= 22), which then
      # fails `next build` at serverExternalPackages resolution.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run smoke script
        run: bash scripts/smoke.sh
