name: Publish control-plane release

# Fires when a v* tag is pushed (e.g. v0.4.0). Slices the matching
# section out of control/CHANGELOG.md and creates a GitHub Release
# with that body. bot-v* tags are unaffected — those start with "b"
# and are handled by publish-bot-image.yml.

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Slice changelog section
        id: slice
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { flag=1; next }
            /^## \[/ { flag=0 }
            flag
          ' control/CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::No changelog section found for [$version] in control/CHANGELOG.md"
            exit 1
          fi
          # GitHub caps a release body at 125,000 characters. A big release
          # (2.0.0 carried ~157 KB) must be cut at a line boundary and pointed
          # at the full section; the changelog stays the source of truth.
          limit=118000
          if [ "$(wc -c < /tmp/notes.md)" -gt "$limit" ]; then
            head -c "$limit" /tmp/notes.md | sed '$d' > /tmp/notes.cut
            printf '\n\n---\n\n*Release notes truncated at %s characters. Full notes: https://github.com/%s/blob/%s/control/CHANGELOG.md*\n' \
              "$limit" "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME" >> /tmp/notes.cut
            mv /tmp/notes.cut /tmp/notes.md
            echo "notes truncated to $limit bytes"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/notes.md \
            --latest
