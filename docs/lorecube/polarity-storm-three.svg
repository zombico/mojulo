oj-mark" data-mark-kind="text" data-idx="14"><text x="280" y="546" fill="#7b8491" font-size="11" font-weight="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">solid arrow: beats</text></g></svg>
