<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1040 677" class="w-full h-auto" preserveAspectRatio="xMidYMid meet" role="img" aria-label="App creation map"><defs><marker id="creation-map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6a6a"></path></marker><marker id="moj-h-arrow-4a5160" orient="auto-start-reverse" markerUnits="strokeWidth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8"><path d="M0 0 L10 5 L0 10 z" fill="#4a5160"></path></marker><filter id="creation-map-label-shadow" x="-25%" y="-50%" width="150%" height="200%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#000" flood-opacity="0.35"></feDropShadow></filter><filter id="creation-map-elevation" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#000" flood-opacity="0.45"></feDropShadow></filter></defs><g class="moj-mark" data-mark-kind="text" data-idx="0"><text x="520" y="34" fill="#2b2f36" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">The Drowned Valley: the world as it stands where the text stops</text></g><g class="moj-mark" data-mark-kind="text" data-idx="1"><text x="520" y="56" fill="#7b8491" font-size="13" font-weight="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">each place in the state the events left it; an arrow is what passes between two</text></g><g class="moj-mark" data-mark-kind="line" data-idx="2"><line x1="459.4" y1="208" x2="277.5" y2="388" stroke="#4a5160" stroke-width="1.8" stroke-linecap="round" marker-end="url(#moj-h-arrow-4a5160)"></line></g><g class="moj-mark" data-mark-kind="line" data-idx="3"><line x1="690.1" y1="448" x2="349.9" y2="448" stroke="#4a5160" stroke-width="1.8" stroke-linecap="round" marker-end="url(#moj-h-arrow-4a5160)"></line></g><g class="moj-mark" data-mark-kind="rect" data-idx="4"><rect x="395" y="96" width="250" height="104" rx="10" fill="#fbf5e4" stroke="#2b2f36" stroke-width="1.4"></rect></g><g class="moj-mark" data-mark-kind="text" data-idx="5"><text x="520" y="120" fill="#2b2f36" font-size="13" font-weight="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">the dam</text></g><g class="moj-mark" data-mark-kind="text" data-idx="6"><text x="520" y="139" fill="#7b8491" font-size="10" font-weight="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">holds; the millers&#x27; and no one else&#x27;s</text></g><g class="moj-mark" data-mark-kind="text" data-idx="7"><text x="520" y="191" fill="#2b2f36" font-size="10" font-weight="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">the millers</text></g><g class="moj-mark" data-mark-kind="rect" data-idx="8"><rect x="698.1" y="396" width="250" height="104" rx="10" fill="#fbf5e4" stroke="#2b2f36" stroke-width="1.4"></rect></g><g class="moj-mark" data-mark-kind="text" data-idx="9"><text x="823.1" y="420" fill="#2b2f36" font-size="13" font-weight="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">the lake</text></g><g class="moj-mark" data-mark-kind="text" data-idx="10"><text x="823.1" y="439" fill="#7b8491" font-size="10" font-weight="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">the valley, under water</text></g><g class="moj-mark" data-mark-kind="text" data-idx="11"><text x="823.1" y="491" fill="#2b2f36" font-size="10" font-weight="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">the ferrymen</text></g><g class="moj-mark" data-mark-kind="rect" data-idx="12"><rect x="91.9" y="396" width="250" height="104" rx="10" fill="#fbf5e4" stroke="#2b2f36" stroke-width="1.4"></rect></g><g class="moj-mark" data-mark-kind="text" data-idx="13"><text x="216.9" y="420" fill="#2b2f36" font-size="13" font-weight="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">the mill town</text></g><g class="moj-mark" data-mark-kind="text" data-idx="14"><text x="216.9" y="439" fill="#7b8491" font-size="10" font-weight="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">crowded since the move, dark most nights</text></g><g class="moj-mark" data-mark-kind="text" data-idx="15"><text x="216.9" y="491" fill="#2b2f36" font-size="10" font-weight="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">the millers, the lowlanders</text></g><g class="moj-mark" data-mark-kind="rect" data-idx="16"><rect x="338.1" y="259.8" width="111.6" height="18" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1"></rect></g><g class="moj-mark" data-mark-kind="text" data-idx="17"><text x="393.9" y="272.8" fill="#2b2f36" font-size="11" font-weight="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">power, at a toll</text></g><g class="moj-mark" data-mark-kind="rect" data-idx="18"><rect x="478.3" y="435" width="178.7" height="18" rx="4" fill="#ffffff" stroke="#c9ced6" stroke-width="1"></rect></g><g class="moj-mark" data-mark-kind="text" data-idx="19"><text x="567.6" y="448" fill="#2b2f36" font-size="11" font-weight="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">people and goods by ferry *</text></g><g class="moj-mark" data-mark-kind="text" data-idx="20"><text x="50" y="634" fill="#7b8491" font-size="11" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">the bells of the drowned church are heard in a dry summer</text></g><g class="moj-mark" data-mark-kind="text" data-idx="21"><text x="50" y="655" fill="#7b8491" font-size="11" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">* read into the text (inferred), not stated</text></g></svg>
