<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1060 614" class="w-full h-auto" preserveAspectRatio="xMidYMid meet" role="img" aria-label="App creation map"><defs><marker id="creation-map-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a6a6a"></path></marker><filter id="creation-map-label-shadow" x="-25%" y="-50%" width="150%" height="200%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="#000" flood-opacity="0.35"></feDropShadow></filter><filter id="creation-map-elevation" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#000" flood-opacity="0.45"></feDropShadow></filter></defs><g class="moj-mark" data-mark-kind="text" data-idx="0"><text x="530" y="34" fill="#2b2f36" font-size="18" font-weight="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">The Drowned Valley: what the text says happened, in order</text></g><g class="moj-mark" data-mark-kind="text" data-idx="1"><text x="530" y="56" fill="#7b8491" font-size="13" font-weight="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">each line is the text&#x27;s; on the right, the earlier events it comes from</text></g><g class="moj-mark" data-mark-kind="rect" data-idx="2"><rect x="20" y="84" width="1020" height="72" rx="8" fill="#f1d8cf" stroke="#c9ced6" stroke-width="1"></rect></g><g class="moj-mark" data-mark-kind="text" data-idx="3"><text x="34" y="106" fill="#2b2f36" font-size="12" font-weight="700" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">the floods and the dam</text></g><g class="moj-mark" data-mark-kind="text" data-idx="4"><text x="34" y="146" fill="#7b8491" font-size="10" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">people act</text></g><g class="moj-mark" data-mark-kind="circle" data-idx="5"><circle cx="220" cy="104" r="10" fill="#ffffff" stroke="#2b2f36" stroke-width="1.2"></circle></g><g class="moj-mark" data-mark-kind="text" data-idx="6"><text x="220" y="108" fill="#2b2f36" font-size="10" font-weight="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">1</text></g><g class="moj-mark" data-mark-kind="text" data-idx="7"><text x="240" y="108" fill="#2b2f36" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">The river floods the low fields three years running</text></g><g class="moj-mark" data-mark-kind="text" data-idx="8"><text x="1026" y="108" fill="#b4472f" font-size="10" font-weight="400" text-anchor="end" font-family="Inter, system-ui, sans-serif, sans-serif"></text></g><g class="moj-mark" data-mark-kind="circle" data-idx="9"><circle cx="220" cy="134" r="10" fill="#ffffff" stroke="#2b2f36" stroke-width="1.2"></circle></g><g class="moj-mark" data-mark-kind="text" data-idx="10"><text x="220" y="138" fill="#2b2f36" font-size="10" font-weight="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">2</text></g><g class="moj-mark" data-mark-kind="text" data-idx="11"><text x="240" y="138" fill="#2b2f36" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">The millers dam it above the valley</text></g><g class="moj-mark" data-mark-kind="text" data-idx="12"><text x="1026" y="138" fill="#7b8491" font-size="10" font-weight="400" text-anchor="end" font-family="Inter, system-ui, sans-serif, sans-serif">from 1</text></g><g class="moj-mark" data-mark-kind="rect" data-idx="13"><rect x="20" y="164" width="1020" height="42" rx="8" fill="#dfe3ea" stroke="#c9ced6" stroke-width="1"></rect></g><g class="moj-mark" data-mark-kind="text" data-idx="14"><text x="34" y="186" fill="#2b2f36" font-size="12" font-weight="700" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">the drowning</text></g><g class="moj-mark" data-mark-kind="text" data-idx="15"><text x="34" y="196" fill="#b4472f" font-size="10" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">no one can act</text></g><g class="moj-mark" data-mark-kind="circle" data-idx="16"><circle cx="220" cy="184" r="10" fill="#ffffff" stroke="#2b2f36" stroke-width="1.2"></circle></g><g class="moj-mark" data-mark-kind="text" data-idx="17"><text x="220" y="188" fill="#2b2f36" font-size="10" font-weight="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">3</text></g><g class="moj-mark" data-mark-kind="text" data-idx="18"><text x="240" y="188" fill="#2b2f36" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">The valley drowns behind the dam; no one can stop the water</text></g><g class="moj-mark" data-mark-kind="text" data-idx="19"><text x="1026" y="188" fill="#7b8491" font-size="10" font-weight="400" text-anchor="end" font-family="Inter, system-ui, sans-serif, sans-serif">from 2</text></g><g class="moj-mark" data-mark-kind="rect" data-idx="20"><rect x="20" y="214" width="1020" height="102" rx="8" fill="#e4ead9" stroke="#c9ced6" stroke-width="1"></rect></g><g class="moj-mark" data-mark-kind="text" data-idx="21"><text x="34" y="236" fill="#2b2f36" font-size="12" font-weight="700" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">the move and the toll</text></g><g class="moj-mark" data-mark-kind="text" data-idx="22"><text x="34" y="306" fill="#7b8491" font-size="10" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">people act</text></g><g class="moj-mark" data-mark-kind="circle" data-idx="23"><circle cx="220" cy="234" r="10" fill="#ffffff" stroke="#2b2f36" stroke-width="1.2"></circle></g><g class="moj-mark" data-mark-kind="text" data-idx="24"><text x="220" y="238" fill="#2b2f36" font-size="10" font-weight="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">4</text></g><g class="moj-mark" data-mark-kind="text" data-idx="25"><text x="240" y="238" fill="#2b2f36" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">The lowlanders move up to the mill town</text></g><g class="moj-mark" data-mark-kind="text" data-idx="26"><text x="1026" y="238" fill="#7b8491" font-size="10" font-weight="400" text-anchor="end" font-family="Inter, system-ui, sans-serif, sans-serif">from 3</text></g><g class="moj-mark" data-mark-kind="circle" data-idx="27"><circle cx="220" cy="264" r="10" fill="#ffffff" stroke="#2b2f36" stroke-width="1.2"></circle></g><g class="moj-mark" data-mark-kind="text" data-idx="28"><text x="220" y="268" fill="#2b2f36" font-size="10" font-weight="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">5</text></g><g class="moj-mark" data-mark-kind="text" data-idx="29"><text x="240" y="268" fill="#2b2f36" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">Ferries begin to cross the new lake</text></g><g class="moj-mark" data-mark-kind="text" data-idx="30"><text x="1026" y="268" fill="#b4472f" font-size="10" font-weight="400" text-anchor="end" font-family="Inter, system-ui, sans-serif, sans-serif">no cause given</text></g><g class="moj-mark" data-mark-kind="circle" data-idx="31"><circle cx="220" cy="294" r="10" fill="#ffffff" stroke="#2b2f36" stroke-width="1.2"></circle></g><g class="moj-mark" data-mark-kind="text" data-idx="32"><text x="220" y="298" fill="#2b2f36" font-size="10" font-weight="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">6</text></g><g class="moj-mark" data-mark-kind="text" data-idx="33"><text x="240" y="298" fill="#2b2f36" font-size="12" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">The millers raise the toll on power; the town goes dark two nights in three</text></g><g class="moj-mark" data-mark-kind="text" data-idx="34"><text x="1026" y="298" fill="#7b8491" font-size="10" font-weight="400" text-anchor="end" font-family="Inter, system-ui, sans-serif, sans-serif">from 2, 4</text></g><g class="moj-mark" data-mark-kind="line" data-idx="35"><line x1="20" y1="328" x2="1040" y2="328" stroke="#b4472f" stroke-width="2" stroke-linecap="round" stroke-dasharray="8 5"></line></g><g class="moj-mark" data-mark-kind="text" data-idx="36"><text x="530" y="348" fill="#b4472f" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">the text stops here, and play begins, seen through a ferryman (the author&#x27;s)</text></g><g class="moj-mark" data-mark-kind="text" data-idx="37"><text x="34" y="374" fill="#2b2f36" font-size="12" font-weight="700" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">As the world stands</text></g><g class="moj-mark" data-mark-kind="text" data-idx="38"><text x="44" y="392" fill="#2b2f36" font-size="11" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">· the dam: holds; the millers&#x27; and no one else&#x27;s</text></g><g class="moj-mark" data-mark-kind="text" data-idx="39"><text x="44" y="408" fill="#2b2f36" font-size="11" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">· the lake: the valley, under water</text></g><g class="moj-mark" data-mark-kind="text" data-idx="40"><text x="44" y="424" fill="#2b2f36" font-size="11" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">· the mill town: crowded since the move, dark most nights</text></g><g class="moj-mark" data-mark-kind="text" data-idx="41"><text x="34" y="454" fill="#2b2f36" font-size="12" font-weight="700" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">What living there is like</text></g><g class="moj-mark" data-mark-kind="text" data-idx="42"><text x="44" y="472" fill="#7b8491" font-size="11" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">· the bells of the drowned church are heard in a dry summer</text></g><g class="moj-mark" data-mark-kind="text" data-idx="43"><text x="34" y="502" fill="#2b2f36" font-size="12" font-weight="700" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">Planted, and not returned to</text></g><g class="moj-mark" data-mark-kind="text" data-idx="44"><text x="44" y="520" fill="#2b2f36" font-size="11" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">· the drowned church</text></g><g class="moj-mark" data-mark-kind="text" data-idx="45"><text x="34" y="550" fill="#2b2f36" font-size="12" font-weight="700" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">Not said by the text</text></g><g class="moj-mark" data-mark-kind="text" data-idx="46"><text x="44" y="568" fill="#7b8491" font-size="11" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">· how long ago the valley drowned</text></g><g class="moj-mark" data-mark-kind="text" data-idx="47"><text x="44" y="584" fill="#7b8491" font-size="11" font-weight="400" text-anchor="start" font-family="Inter, system-ui, sans-serif, sans-serif">· whose side the ferrymen are on</text></g></svg>
