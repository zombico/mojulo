 fill="#7b8491" font-size="10" font-weight="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">what it wants is not said</text></g><g class="moj-mark" data-mark-kind="rect" data-idx="16"><rect x="40" y="304" width="300" height="54" rx="27" fill="#eef0f3" stroke="#2b2f36" stroke-width="1.4" stroke-dasharray="6 4"></rect></g><g class="moj-mark" data-mark-kind="text" data-idx="17"><text x="190" y="326" fill="#2b2f36" font-size="13" font-weight="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">the river</text></g><g class="moj-mark" data-mark-kind="text" data-idx="18"><text x="190" y="344" fill="#7b8491" font-size="10" font-weight="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">wants nothing</text></g><g class="moj-mark" data-mark-kind="rect" data-idx="19"><rect x="620" y="168" width="380" height="54" rx="8" fill="#ffffff" stroke="#2b2f36" stroke-width="1.3"></rect></g><g class="moj-mark" data-mark-kind="text" data-idx="20"><text x="810" y="190" fill="#2b2f36" font-size="13" font-weight="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">the floods</text></g><g class="moj-mark" data-mark-kind="text" data-idx="21"><text x="810" y="208" fill="#7b8491" font-size="10" font-weight="400" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">resolved</text></g><g class="moj-mark" data-mark-kind="rect" data-idx="22"><rect x="620" y="236" width="380" height="54" rx="8" fill="#fdf1ec" stroke="#b4472f" stroke-width="2.2"></rect></g><g class="moj-mark" data-mark-kind="text" data-idx="23"><text x="810" y="258" fill="#b4472f" font-size="13" font-weight="700" text-anchor="middle" font-family="Inter, system-ui, sans-serif, sans-serif">the price of power</text></g><g class="moj-mark" data-mark-kind="text" data-idx="24"><text x="810" y="276" fill="#b4472f" font-size="10" font-weight="400" text-anchor="middle" font-family="Inter, system-ui, sa