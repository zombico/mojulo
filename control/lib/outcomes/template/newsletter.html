{{>doc-head}}
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #525252;
    --faint: #8a8a8a;
    --line: #e7e5e0;
    --paper: #fafaf7;
    --card: #ffffff;
    --accent: #c2410c;
    --accent-soft: #fff7ed;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .issue {
    max-width: 860px;
    margin: 0 auto;
    padding: 56px 32px 96px;
  }
  header.masthead {
    border-bottom: 4px double var(--ink);
    padding-bottom: 22px;
    margin-bottom: 32px;
  }
  header.masthead .top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 10px;
  }
  header.masthead h1 {
    font-family: "Iowan Old Style", Georgia, serif;
    font-size: 48px;
    line-height: 1.05;
    margin: 0 0 12px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  header.masthead .lede {
    font-size: 17px;
    color: var(--muted);
    margin: 0;
    max-width: 60ch;
  }
  header.masthead .lede p { margin: 0 0 0.6em; }
  header.masthead .lede p:last-child { margin-bottom: 0; }
  .hero-figure {
    margin: 0 0 32px;
  }
  .hero-figure .visual {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px;
  }
  .hero-figure .visual svg,
  .hero-figure .visual img {
    width: 100%;
    height: auto;
    display: block;
  }
  .hero-figure figcaption {
    margin-top: 8px;
    text-align: center;
    font-size: 12px;
    color: var(--faint);
    font-style: italic;
  }
  .articles {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
    margin-bottom: 36px;
  }
  .article {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 22px 24px;
  }
  .article h2 {
    font-size: 22px;
    margin: 0 0 10px;
    font-weight: 600;
    letter-spacing: -0.005em;
  }
  .article .body { font-size: 15px; color: var(--muted); line-height: 1.6; }
  .article .body p { margin: 0 0 0.7em; }
  .article .body ul, .article .body ol { padding-left: 1.4em; margin: 0 0 0.7em; }
  .article .body strong { color: var(--ink); }
  .article .body a { color: var(--accent); text-decoration: none; border-bottom: 1px dotted var(--accent); }
  .article.pull-quote {
    background: var(--accent-soft);
    border-color: var(--accent);
    font-size: 18px;
    font-style: italic;
    color: var(--ink);
    text-align: center;
    padding: 28px 32px;
  }
  .article.pull-quote::before { content: "“"; font-size: 48px; color: var(--accent); line-height: 0.4; }
  .article.pull-quote::after { content: "”"; font-size: 48px; color: var(--accent); line-height: 0; vertical-align: -28px; }
  .links-section {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 22px 24px;
    margin-bottom: 28px;
  }
  .links-section h3 {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 12px;
  }
  .links-section .link {
    padding: 10px 0;
    border-top: 1px solid var(--line);
  }
  .links-section .link:first-of-type { border-top: 0; }
  .links-section .link a {
    color: var(--ink);
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    display: block;
  }
  .links-section .link a:hover { color: var(--accent); }
  .links-section .link .domain {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    color: var(--faint);
    margin-top: 2px;
    display: block;
  }
  footer.colophon {
    margin-top: 48px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px;
    color: var(--faint);
    text-align: center;
    letter-spacing: 0.04em;
  }
  footer.colophon code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  @media (max-width: 700px) {
    .articles { grid-template-columns: 1fr; }
  }
  @media print {
    body { background: white; }
    .issue { padding: 24px; max-width: none; }
  }
</style>
{{style_overrides}}
</head>
<body>
<article class="issue">
  <header class="masthead">
    <div class="top">
      <span>{{nl_kicker}}</span>
      <span>{{generated_at_human}}</span>
    </div>
    <h1>{{nl_title}}</h1>
    <div class="lede">{{nl_lede_html}}</div>
  </header>
  {{nl_hero_html}}
  <section class="articles">{{nl_articles_html}}</section>
  {{nl_links_html}}
  <footer class="colophon">
    newsletter template v{{template_version}} &middot; <code>{{cook_ref}}</code> &middot; {{generated_at_iso}}
  </footer>
</article>
</body>
</html>
