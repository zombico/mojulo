{{>doc-head}}
<style>
  /* Book-viewer aspect — see partials/book-viewer.html. Default is close to
     a 1.43:1 trade-book page (10/7, landscape-ish). The writer can pass
     `viewerAspect: '7 / 10'` (or any ratio) for a portrait book. */
  body { --viewer-aspect: {{viewer_aspect}}; }
</style>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #525252;
    --faint: #8a8a8a;
    --line: #e5e3df;
    --paper: #fafaf7;
    --page: #ffffff;
    --accent: #1d4ed8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .book {
    max-width: 920px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }
  .cover {
    background: var(--page);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 72px 56px 64px;
    margin-bottom: 48px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .cover .eyebrow {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 24px;
  }
  .cover h1 {
    font-size: 40px;
    line-height: 1.15;
    margin: 0 0 28px;
    color: var(--ink);
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .cover .blurb {
    font-size: 16px;
    color: var(--muted);
    max-width: 56ch;
    margin: 0 auto;
    text-align: left;
  }
  .cover .blurb p { margin: 0 0 0.8em; }
  .cover .blurb p:last-child { margin-bottom: 0; }
  .cover .imprint {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px;
    color: var(--faint);
    margin-top: 40px;
    letter-spacing: 0.04em;
  }

  .chapter-divider {
    margin: 64px 0 24px;
    text-align: center;
  }
  .chapter-divider .label {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--faint);
  }
  .chapter-divider h2 {
    font-size: 22px;
    margin: 6px 0 0;
    font-weight: 600;
    color: var(--ink);
  }

  .page {
    background: var(--page);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 32px 40px 24px;
    margin: 28px 0;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    page-break-inside: avoid;
    break-inside: avoid;
  }
  .page .illustration {
    aspect-ratio: 16 / 10;
    background: #fdfdfb;
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .page .illustration svg {
    width: 100%;
    height: 100%;
    display: block;
  }
  .page .illustration.missing {
    color: var(--faint);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px;
    padding: 24px;
    text-align: center;
    aspect-ratio: 16 / 10;
  }
  .page .caption {
    margin-top: 24px;
    font-size: 17px;
    color: var(--ink);
    line-height: 1.6;
  }
  .page .caption p { margin: 0 0 0.8em; }
  .page .caption p:last-child { margin-bottom: 0; }
  .page .caption.empty {
    color: var(--faint);
    font-style: italic;
    font-size: 14px;
  }
  .page .page-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    padding-top: 12px;
    border-top: 1px dashed var(--line);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.04em;
  }

  footer.colophon {
    margin-top: 64px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px;
    color: var(--faint);
    text-align: center;
    letter-spacing: 0.04em;
  }
  footer.colophon a { color: var(--faint); text-decoration: none; }
  footer.colophon a:hover { color: var(--accent); text-decoration: underline; }
  footer.colophon code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
  }

  /* Print-friendly so an operator can browser-print to PDF without Playwright. */
  @media print {
    body { background: white; }
    .book { padding: 0; max-width: none; }
    .cover, .page { box-shadow: none; border-color: #ddd; page-break-after: always; break-after: page; }
    .chapter-divider { page-break-before: always; break-before: page; }
    footer.colophon { page-break-before: always; break-before: page; }
  }
</style>
{{style_overrides}}
</head>
<body>
<article class="book">

  <section class="cover" data-viewer-page>
    <p class="eyebrow">A picture book</p>
    <h1>{{cover_title}}</h1>
    <div class="blurb">{{cover_blurb_html}}</div>
    <p class="imprint">Mojulo &middot; {{generated_at_human}}</p>
  </section>

  {{pages_html}}

  <footer class="colophon">
    Materialized by <a href="https://mojulo.local">mojulo cook</a> &middot;
    picture_book template v{{template_version}} &middot;
    <code>{{cook_ref}}</code> &middot;
    {{generated_at_iso}}
  </footer>

</article>

{{>book-viewer}}
</body>
</html>
