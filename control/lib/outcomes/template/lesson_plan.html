{{>doc-head}}
<style>
  :root {
    --ink: #0f172a;
    --muted: #475569;
    --faint: #94a3b8;
    --line: #e2e8f0;
    --paper: #f8fafc;
    --page: #ffffff;
    --accent: #0f766e;
    --accent-soft: #ecfdf5;
    --warm: #b45309;
    --warm-soft: #fffbeb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .sheet { max-width: 820px; margin: 0 auto; padding: 40px 24px 96px; }

  .face-bar {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    background: var(--page); border: 1px solid var(--line); border-radius: 6px;
    padding: 10px 16px; margin-bottom: 20px; font-size: 13px;
  }
  .face-bar .here { color: var(--accent); font-weight: 700; letter-spacing: 0.02em; }
  .face-bar a { color: var(--muted); text-decoration: none; font-weight: 600; }
  .face-bar a:hover { color: var(--accent); }

  .cover {
    background: var(--page); border: 1px solid var(--line); border-radius: 6px;
    padding: 40px 40px 32px; margin-bottom: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .cover .eyebrow {
    font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); margin: 0 0 14px; font-weight: 700;
  }
  .cover h1 { font-size: 30px; line-height: 1.2; margin: 0 0 14px; font-weight: 800; letter-spacing: -0.01em; }
  .cover .band-chip {
    display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    background: var(--accent-soft); color: var(--accent); padding: 3px 10px; border-radius: 999px;
  }
  .overview { margin: 18px 0 0; color: var(--muted); font-size: 15px; border-left: 3px solid var(--accent-soft); padding-left: 16px; }
  .overview p { margin: 0 0 0.7em; }
  .overview p:last-child { margin-bottom: 0; }

  .lesson-section {
    background: var(--page); border: 1px solid var(--line); border-radius: 6px;
    padding: 28px 36px; margin: 18px 0; box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .sec-head { margin: 0 0 18px; padding-bottom: 10px; border-bottom: 2px solid var(--accent); }
  .sec-head h2 { font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin: 0; font-weight: 800; }

  .step { margin: 0 0 20px; position: relative; }
  .step:last-child { margin-bottom: 0; }
  .step .timing {
    display: inline-block; font-size: 11px; font-weight: 700; color: var(--warm);
    background: var(--warm-soft); border: 1px solid #fde68a; padding: 2px 8px; border-radius: 4px;
    margin-bottom: 8px; letter-spacing: 0.03em;
  }
  .step-title { font-size: 17px; margin: 0 0 8px; font-weight: 700; }
  .step-body { font-size: 15px; color: var(--ink); }
  .step-body p { margin: 0 0 0.7em; }
  .step-body ul, .step-body ol { margin: 0 0 0.7em 1.4em; padding: 0; }
  .step-body li { margin: 0 0 0.3em; }
  .step-body code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; background: var(--accent-soft); color: var(--accent); padding: 1px 5px; border-radius: 3px; }
  .step-body table { width: 100%; border-collapse: collapse; margin: 0 0 0.8em; font-size: 14px; }
  .step-body th, .step-body td { padding: 7px 11px; border-bottom: 1px solid var(--line); text-align: left; }
  .step-body th { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

  .teacher-note {
    margin: 10px 0 0; background: var(--warm-soft); border-left: 4px solid var(--warm);
    border-radius: 0 4px 4px 0; padding: 10px 14px; font-size: 14px; color: #78350f;
  }
  .teacher-note .tn-label { display: block; font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--warm); font-weight: 800; margin-bottom: 4px; }
  .teacher-note p { margin: 0 0 0.5em; }
  .teacher-note p:last-child { margin-bottom: 0; }

  .check { margin: 0 0 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 5px; background: var(--paper); }
  .check:last-child { margin-bottom: 0; }
  .check-q p { margin: 0 0 0.5em; font-weight: 600; }
  .check-a { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); color: var(--accent); }
  .check-a-label { display: inline-block; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 800; margin-right: 8px; }
  .check-a p { margin: 0 0 0.4em; }

  .ref { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 0; border-bottom: 1px dotted var(--line); }
  .ref:last-child { border-bottom: 0; }
  .ref a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 15px; }
  .ref a:hover { text-decoration: underline; }
  .ref-domain { font-size: 11px; color: var(--faint); white-space: nowrap; }

  .figure { margin: 0 0 18px; background: var(--paper); border: 1px solid var(--line); border-radius: 5px; padding: 16px 18px 12px; }
  .figure:last-child { margin-bottom: 0; }
  .figure .fig-img { aspect-ratio: 16 / 10; background: var(--page); border: 1px solid var(--line); border-radius: 2px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .figure .fig-img svg { width: 100%; height: 100%; display: block; }
  .figure .fig-img.missing { color: var(--faint); font-family: ui-monospace, Menlo, monospace; font-size: 12px; padding: 20px; text-align: center; }
  .figure figcaption { margin-top: 10px; font-size: 13px; color: var(--muted); }
  .figure .fig-label { color: var(--ink); font-weight: 600; }
  .figure .fig-caption { margin-top: 6px; }
  .figure .fig-caption p { margin: 0 0 0.4em; }

  .callout { background: var(--accent-soft); border-left: 4px solid var(--accent); border-radius: 0 4px 4px 0; padding: 12px 16px; margin: 0 0 16px; }
  .callout:last-child { margin-bottom: 0; }
  .callout .callout-title { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 800; margin: 0 0 5px; }
  .callout .callout-body { margin: 0; font-size: 14.5px; }

  footer.colophon { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 11px; color: var(--faint); text-align: center; letter-spacing: 0.04em; }
  footer.colophon code { font-family: ui-monospace, Menlo, monospace; }
</style>
{{style_overrides}}
</head>
<body>
<main class="sheet">
  <nav class="face-bar">
    <span class="here">Teacher plan</span>
    <a href="handout.html">Open student handout (printable) →</a>
  </nav>

  <section class="cover">
    <p class="eyebrow">Lesson plan</p>
    <h1>{{cover_title}}</h1>
    <span class="band-chip">Learner band · {{band_label}}</span>
    {{overview_html}}
  </section>

  {{sections_html}}

  <footer class="colophon">
    lesson_plan template v{{template_version}} &middot; <code>{{cook_ref}}</code> &middot; {{generated_at_human}}
  </footer>
</main>
</body>
</html>
