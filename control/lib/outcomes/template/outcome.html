<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="generator" content="mojulo cook / outcome template v{{template_version}}">
<title>{{title}}</title>
<style>
  :root {
    --ink: #0f172a;
    --muted: #475569;
    --faint: #94a3b8;
    --line: #e2e8f0;
    --bg: #f8fafc;
    --paper: #ffffff;
    --accent: #1d4ed8;
    --chip-bg: #eef2ff;
    --chip-ink: #3730a3;
    --code-bg: #f1f5f9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 800px;
    margin: 0 auto;
    padding: 48px 32px 96px;
  }
  header.frontmatter {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 24px 28px;
    margin-bottom: 32px;
  }
  header.frontmatter .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 8px;
  }
  header.frontmatter h1 {
    font-size: 24px;
    line-height: 1.25;
    margin: 0 0 16px;
    color: var(--ink);
  }
  .meta-grid {
    display: grid;
    grid-template-columns: max-content 1fr;
    column-gap: 16px;
    row-gap: 6px;
    font-size: 13px;
    color: var(--muted);
  }
  .meta-grid dt { color: var(--faint); font-weight: 500; }
  .meta-grid dd { margin: 0; }
  .meta-grid a { color: var(--accent); text-decoration: none; }
  .meta-grid a:hover { text-decoration: underline; }
  .chip {
    display: inline-block;
    padding: 2px 10px;
    background: var(--chip-bg);
    color: var(--chip-ink);
    border-radius: 999px;
    font-size: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .stash-chip {
    display: inline-block;
    margin: 0 6px 6px 0;
    padding: 4px 10px;
    background: #f1f5f9;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 13px;
    color: var(--muted);
    text-decoration: none;
  }
  .stash-chip code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--faint);
    margin-left: 6px;
  }
  main.report {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 32px 40px;
    font-size: 16px;
  }
  main.report h1, main.report h2, main.report h3, main.report h4 {
    line-height: 1.3;
    margin-top: 1.6em;
    margin-bottom: 0.6em;
  }
  main.report h1 { font-size: 22px; }
  main.report h2 { font-size: 19px; }
  main.report h3 { font-size: 17px; }
  main.report h4 { font-size: 15px; color: var(--muted); }
  main.report > :first-child { margin-top: 0; }
  main.report p { margin: 0.8em 0; }
  main.report ul, main.report ol { padding-left: 1.6em; }
  main.report code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.92em;
    background: var(--code-bg);
    padding: 1px 6px;
    border-radius: 4px;
  }
  main.report pre {
    background: var(--code-bg);
    padding: 14px 16px;
    border-radius: 8px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.5;
    margin: 1.2em 0;
  }
  main.report pre code { background: transparent; padding: 0; font-size: inherit; }
  main.report blockquote {
    border-left: 3px solid var(--accent);
    margin: 1em 0;
    padding: 4px 16px;
    color: var(--muted);
  }
  main.report a { color: var(--accent); }
  main.report hr {
    border: none;
    border-top: 1px solid var(--line);
    margin: 2em 0;
  }
  main.report table {
    border-collapse: collapse;
    margin: 1.2em 0;
    font-size: 14px;
  }
  main.report th, main.report td {
    border: 1px solid var(--line);
    padding: 6px 10px;
    text-align: left;
  }
  main.report th { background: var(--code-bg); font-weight: 600; }
  section.visuals {
    margin-top: 32px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 32px 40px;
  }
  section.visuals h2 {
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 20px;
  }
  .visual-card {
    margin: 0 0 28px;
    padding: 16px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  .visual-card:last-child { margin-bottom: 0; }
  .visual-card .visual-body {
    display: flex;
    justify-content: center;
    max-width: 100%;
    overflow-x: auto;
  }
  .visual-card .visual-body svg,
  .visual-card .visual-body img {
    max-width: 100%;
    height: auto;
  }
  .visual-card .visual-caption {
    margin-top: 12px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
    font-style: italic;
  }
  footer.actions {
    margin-top: 40px;
    padding: 24px 0;
    text-align: center;
    border-top: 1px solid var(--line);
    font-size: 13px;
    color: var(--faint);
  }
  footer.actions a {
    display: inline-block;
    margin: 0 12px;
    color: var(--accent);
    text-decoration: none;
    padding: 8px 16px;
    border: 1px solid var(--accent);
    border-radius: 6px;
  }
  footer.actions a:hover { background: var(--accent); color: white; }
  footer.actions .stamp {
    display: block;
    margin-top: 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--faint);
  }
</style>
</head>
<body>
<div class="page">
  <header class="frontmatter">
    <p class="eyebrow">Cook · Outcome Artifact</p>
    <h1>{{title}}</h1>
    <dl class="meta-grid">
      <dt>Aim</dt><dd>{{aim_text}}</dd>
      <dt>Cleaved slices</dt><dd>{{cleaved_slices}}</dd>
      <dt>Lens</dt><dd>{{lens}}</dd>
      <dt>Generated</dt><dd>{{generated_at_human}} · <span class="chip">{{cook_ref}}</span></dd>
    </dl>
  </header>

  <main class="report">
{{report_html}}
  </main>

  {{visuals_section}}

  <footer class="actions">
    <a href="{{plan_handoff_url}}">Send to plan mojulo →</a>
    <span class="stamp">mojulo outcome template v{{template_version}} · generated {{generated_at_iso}}</span>
  </footer>
</div>
</body>
</html>
