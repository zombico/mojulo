{{>doc-head}}
<style>
  :root {
    --ink: #0f172a;
    --muted: #475569;
    --faint: #94a3b8;
    --line: #e2e8f0;
    --paper: #f8fafc;
    --page: #ffffff;
    --accent: #4338ca;
    --accent-soft: #eef2ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); }
  body {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .book {
    max-width: 760px;
    margin: 0 auto;
    padding: 56px 24px 96px;
  }
  .cover {
    background: var(--page);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 72px 56px 56px;
    margin-bottom: 36px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .cover .eyebrow {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 18px;
    font-weight: 700;
  }
  .cover h1 {
    font-size: 38px;
    line-height: 1.15;
    margin: 0 0 28px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .cover .preface {
    font-size: 15.5px;
    color: var(--muted);
    border-left: 3px solid var(--accent-soft);
    padding-left: 18px;
    margin-top: 28px;
  }
  .cover .preface p { margin: 0 0 0.7em; }
  .cover .preface p:last-child { margin-bottom: 0; }

  .toc {
    background: var(--page);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 32px 40px;
    margin-bottom: 36px;
  }
  .toc h2 {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 12px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 16px;
    font-weight: 700;
  }
  .toc ol { list-style: none; padding: 0; margin: 0; }
  .toc-row a {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    padding: 8px 0;
    text-decoration: none;
    color: var(--ink);
    border-bottom: 1px dotted var(--line);
  }
  .toc-row a:hover { color: var(--accent); }
  .toc-row:last-child a { border-bottom: 0; }
  .toc-label { font-weight: 600; font-size: 15px; }
  .toc-counts {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px;
    color: var(--faint);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .chapter {
    background: var(--page);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 48px 56px;
    margin: 28px 0;
    box-shadow: 0 1px 2px rgba(0,0,0,0.03);
  }
  .chapter-head { margin: 0 0 28px; padding-bottom: 16px; border-bottom: 2px solid var(--accent); }
  .chapter-head .chapter-num {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 6px;
    font-weight: 700;
  }
  .chapter-head h2 {
    font-size: 28px;
    margin: 0;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .chapter-intro {
    font-size: 16px;
    color: var(--muted);
    margin-bottom: 28px;
    font-style: italic;
  }
  .chapter-intro p { margin: 0 0 0.8em; }
  .chapter-intro p:last-child { margin-bottom: 0; }

  .section { margin: 28px 0; }
  .section h3 {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 18px;
    margin: 0 0 14px;
    font-weight: 700;
    color: var(--ink);
    display: flex;
    gap: 12px;
    align-items: baseline;
  }
  .section h3 .section-num {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
    font-size: 14px;
    letter-spacing: 0.04em;
  }
  .section-body { font-size: 15.5px; color: var(--ink); }
  .section-body p { margin: 0 0 0.9em; }
  .section-body h1, .section-body h2, .section-body h3, .section-body h4 {
    font-family: ui-sans-serif, system-ui, sans-serif;
    margin: 22px 0 10px;
    font-weight: 600;
  }
  .section-body ul, .section-body ol { margin: 0 0 0.9em 1.5em; padding: 0; }
  .section-body li { margin: 0 0 0.3em; }
  .section-body code {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13.5px;
    background: var(--accent-soft);
    color: var(--accent);
    padding: 1px 5px;
    border-radius: 3px;
  }
  .section-body pre {
    background: #0f172a;
    color: #e2e8f0;
    padding: 14px 18px;
    border-radius: 4px;
    overflow-x: auto;
    font-size: 13px;
    line-height: 1.5;
    margin: 0 0 1em;
  }
  .section-body pre code { background: transparent; color: inherit; padding: 0; }
  .section-body blockquote {
    border-left: 3px solid var(--accent-soft);
    padding-left: 16px;
    color: var(--muted);
    margin: 0 0 1em;
  }
  .section-body table { width: 100%; border-collapse: collapse; margin: 0 0 1em; font-size: 14px; }
  .section-body th, .section-body td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; }
  .section-body th { background: var(--accent-soft); color: var(--accent); font-family: ui-sans-serif, system-ui, sans-serif; font-weight: 600; }

  .figure {
    margin: 28px 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 20px 24px 16px;
  }
  .figure .fig-img {
    aspect-ratio: 16 / 10;
    background: var(--page);
    border: 1px solid var(--line);
    border-radius: 2px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .figure .fig-img svg { width: 100%; height: 100%; display: block; }
  .figure .fig-img.missing {
    color: var(--faint);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    padding: 20px;
    text-align: center;
  }
  .figure figcaption {
    margin-top: 12px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
    color: var(--muted);
  }
  .figure .fig-num {
    color: var(--accent);
    font-weight: 700;
    margin-right: 6px;
  }
  .figure .fig-label { color: var(--ink); font-weight: 600; }
  .figure .fig-caption {
    margin-top: 8px;
    color: var(--muted);
    font-family: "Iowan Old Style", Palatino, Georgia, serif;
    font-size: 14.5px;
    line-height: 1.55;
  }
  .figure .fig-caption p { margin: 0 0 0.5em; }
  .figure .fig-caption p:last-child { margin-bottom: 0; }

  .callout {
    background: var(--accent-soft);
    border-left: 4px solid var(--accent);
    border-radius: 0 4px 4px 0;
    padding: 14px 18px;
    margin: 24px 0;
  }
  .callout .callout-title {
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 700;
    margin: 0 0 6px;
  }
  .callout .callout-body {
    margin: 0;
    color: var(--ink);
    font-size: 14.5px;
    line-height: 1.55;
  }

  footer.colophon {
    margin-top: 56px;
    padding-top: 22px;
    border-top: 1px solid var(--line);
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 11px;
    color: var(--faint);
    text-align: center;
    letter-spacing: 0.04em;
  }
  footer.colophon code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  @media print {
    body { background: white; }
    .book { padding: 0; max-width: none; }
    .cover, .toc, .chapter { box-shadow: none; page-break-after: always; break-after: page; }
    .figure { page-break-inside: avoid; break-inside: avoid; }
  }
</style>
{{style_overrides}}
</head>
<body>
<article class="book">
  <section class="cover">
    <p class="eyebrow">A textbook</p>
    <h1>{{cover_title}}</h1>
    <div class="preface">{{preface_html}}</div>
  </section>

  <nav class="toc">
    <h2>Contents</h2>
    <ol>
      {{toc_rows}}
    </ol>
  </nav>

  {{chapters_html}}

  <footer class="colophon">
    textbook template v{{template_version}} &middot; <code>{{cook_ref}}</code> &middot; {{generated_at_human}}
  </footer>
</article>
</body>
</html>
